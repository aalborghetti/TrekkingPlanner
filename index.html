<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#153f61">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TrekkingPlanner">
  <title>TrekkingPlanner · Motore Universale per Trekking a Tappe</title>

  <!-- PWA & Icons -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <!-- Top App Header -->
  <header class="app-header">
    <div class="wrap app-header-inner">
      <a href="#/" class="header-brand">
        <img src="icon-192.png" alt="TrekkingPlanner Logo" class="header-logo">
        <span class="header-title-text" id="header-trek-name">TrekkingPlanner</span>
      </a>

      <!-- Desktop Navigation Bar -->
      <nav class="desktop-nav">
        <a href="#/" class="nav-link active">Panoramica</a>
        <a href="#/tappe" class="nav-link">Tappe</a>
        <a href="#/mappa" class="nav-link">Mappa & GPX</a>
        <a href="#/materiale" class="nav-link">Zaino</a>
        <a href="#/check-serale" class="nav-link">Check Serale</a>
        <a href="#/servizi" class="nav-link">Servizi</a>
        <a href="#/impostazioni" class="nav-link">Backup & Impostazioni</a>
      </nav>

      <div class="header-right">
        <span id="save-indicator" class="save-indicator">Salvato ✓</span>
      </div>
    </div>
  </header>

  <!-- Main SPA Viewport Container -->
  <main id="app-main-content">
    <div class="wrap content-area">
      <div class="card">
        <p>Caricamento itinerario in corso...</p>
      </div>
    </div>
  </main>

  <!-- Mobile Bottom Navigation Bar (iOS Safari & Android PWA) -->
  <nav class="bottom-nav" aria-label="Navigazione Principale">
    <a href="#/" class="bottom-nav-item active">
      <span class="bn-icon">🏠</span>
      <span>Home</span>
    </a>
    <a href="#/tappe" class="bottom-nav-item">
      <span class="bn-icon">🥾</span>
      <span>Tappe</span>
    </a>
    <a href="#/mappa" class="bottom-nav-item">
      <span class="bn-icon">🗺️</span>
      <span>Mappa</span>
    </a>
    <a href="#/materiale" class="bottom-nav-item">
      <span class="bn-icon">🎒</span>
      <span>Zaino</span>
    </a>
    <a href="#/check-serale" class="bottom-nav-item">
      <span class="bn-icon">🌙</span>
      <span>Check</span>
    </a>
    <a href="#/impostazioni" class="bottom-nav-item">
      <span class="bn-icon">⚙️</span>
      <span>Dati</span>
    </a>
  </nav>

  <!-- Leaflet & App ES Modules -->
  <script src="leaflet.js"></script>
  <script type="module" src="js/app.js?v=1.2"></script>
</body>
</html>
